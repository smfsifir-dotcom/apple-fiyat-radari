name: Apple Fiyat Radari APK Olustur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Paketi Ac ve APK Derle
        run: |
          mkdir -p _unpack
          for z in *.zip; do unzip -o "$z" -d _unpack; done
          PUB_PATH=$(find _unpack -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUB_PATH" ]; then echo "pubspec.yaml bulunamadi"; exit 1; fi
          SRC_DIR=$(dirname "$PUB_PATH")
          mkdir -p app_build
          cd app_build
          flutter create . --platforms=android --org com.appleradar --project-name apple_fiyat_radari
          rm -rf lib test
          cp -r "../$SRC_DIR/lib" ./lib
          cp "../$SRC_DIR/pubspec.yaml" ./pubspec.yaml
          cp -r "../$SRC_DIR/scripts" ./scripts
          python3 scripts/patch_android.py
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../Apple-Fiyat-Radari.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Apple-Fiyat-Radari-APK
          path: Apple-Fiyat-Radari.apk
          retention-days: 30
